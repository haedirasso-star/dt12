plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ★ إشعارات الطلبات تحتاج google-services.json لتطبيق com.totv.admin
//   (Firebase Console ← إضافة تطبيق Android). بدونه يُبنى التطبيق بلا إشعارات.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

// التوقيع: نفس مفتاح TOTV+ (يُنسخ تلقائياً في GitHub Actions — انظر admin_build.yml)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: "1"
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: "1.0.0"

android {
    namespace "com.totv.admin"
    compileSdk 35
    ndkVersion "27.0.12077973"

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile     file(keystoreProperties['storeFile'] ?: 'totv_keystore.jks')
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId "com.totv.admin"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode    flutterVersionCode.toInteger()
        versionName    flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // بلا مفتاح ⇐ توقيع debug (للتجربة فقط)
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled   false
            shrinkResources false
        }
    }

    packagingOptions { jniLibs { useLegacyPackaging = true } }
    lint { checkReleaseBuilds false; abortOnError false }
}

flutter { source "../.." }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.multidex:multidex:2.0.1"
}
