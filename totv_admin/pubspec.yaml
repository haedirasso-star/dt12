name: totv_admin
description: TOTV+ Admin — تطبيق الإدارة (صفحة الأدمن داخل تطبيق أندرويد)
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/admin/index.html
    - assets/lib/
    - assets/fonts/
