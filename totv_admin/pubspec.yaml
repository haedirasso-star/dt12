name: totv_admin
description: TOTV+ Admin — تطبيق الإدارة الأصلي (Native)
publish_to: 'none'
version: 3.2.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # نفس إصدارات التطبيق الأساسي (مُجرَّبة في البناء)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  # البوت الداخلي في الخلفية — 4.0.8 متوافق مع AGP 8.7 (الإصدار 5 يحتاج AGP 8.12)
  android_alarm_manager_plus: 4.0.8

flutter:
  uses-material-design: true
